[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conflictbench"
version = "0.1.0"
description = "Controlled benchmark for acquisition and abstention under three-channel evidence conflicts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
mosei = [
    "h5py>=3.8",
    "scikit-learn==1.9.0; python_version >= '3.11'",
    "scikit-learn==1.7.2; python_version < '3.11'",
]
router = [
    "scikit-learn==1.9.0; python_version >= '3.11'",
    "scikit-learn==1.7.2; python_version < '3.11'",
]
cremad = ["numpy==2.2.6", "av==13.1.0", "transformers==4.44.2", "torch==2.5.1", "scikit-learn==1.7.2", "imageio-ffmpeg==0.6.0", "huggingface-hub==0.25.2", "safetensors==0.4.5"]
mmsa = ["gdown>=5.2"]
qwen = ["torch==2.11.0+cu126", "transformers==4.57.6", "qwen-omni-utils==0.0.8"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
